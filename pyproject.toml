[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvs"
version = "0.1.0"
description = "TubuloVillous — Colorectal Polyp Architecture Scorer"
readme = "README.md"
authors = [{name = "TVA Team"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "tiatoolbox==1.5.2",
    "torch==2.1.0",
    "albumentations==1.3.1",
    "rich==13.5.2",
    "tqdm==4.66.1",
    "tifffile==2023.7.18",
    "shapely==2.0.1",
    "timm==0.9.12",
]

[project.optional-dependencies]
test = ["pytest==7.4.2"]

[project.scripts]
tvs-prepare-annotations = "tvs.cli.prepare_annotations:main"
tvs-split = "tvs.cli.split:main"
tvs-preview = "tvs.cli.preview:main"
tvs-train = "tvs.cli.train:main"
tvs-evaluate = "tvs.cli.evaluate:main"
tvs-score = "tvs.cli.score:main"

